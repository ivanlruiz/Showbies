// La libreria Android de los anuncios: el puente con AdMob y con el consentimiento de
// Europa (PuenteAnuncios.java) y el id de la app de AdMob en el manifiesto. Unity la suma
// sola al proyecto de Gradle (dentro de unityLibrary) por terminar en .androidlib. Sale del
// ejemplo del manual de Unity 6000.3 ("Create an Android Library plug-in"), con las
// versiones de Unity leidas de sus propiedades.
//
// Los SDK de Google van aca y no en mainTemplate.gradle: asi todo lo de AdMob queda en
// esta carpeta, y la plantilla sigue siendo la de Unity con una sola linea sumada.
apply plugin: 'com.android.library'

dependencies {
    // El SDK clasico de Google Mobile Ads. Google lo deja de soportar el 30/6/2027 y lo
    // apaga el 30/6/2028: antes hay que pasar al Next-Gen (ver publicacion/pasos.md).
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    // El consentimiento de Europa, el Reino Unido y Suiza (UMP).
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    // androidx.activity y androidx.fragment pedidas a mano (Play Console, 9/10: "activity:1.0.0
    // esta obsoleta" y "fragment:1.1.0 esta obsoleta" en la 1.4.0). AdMob las trae viejas de
    // rebote (play-services-basement -> fragment 1.1.0 -> activity 1.0.0) y nadie pedia unas mas
    // nuevas; pedidas aca, Gradle se queda con estas. AdMob ya trae Kotlin 2.x, asi que no
    // chocan con el de estas. La 1.9.3 de activity cubre lo que pide fragment 1.8.5.
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'
}

android {
    namespace "com.ivanruiz.showbies.anuncios"
    compileSdk getProperty("unity.compileSdkVersion") as int
    buildToolsVersion getProperty("unity.buildToolsVersion")

    compileOptions {
        sourceCompatibility JavaVersion.valueOf(getProperty("unity.javaCompatabilityVersion"))
        targetCompatibility JavaVersion.valueOf(getProperty("unity.javaCompatabilityVersion"))
    }

    defaultConfig {
        minSdk getProperty("unity.minSdkVersion") as int
        targetSdk getProperty("unity.targetSdkVersion") as int
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
